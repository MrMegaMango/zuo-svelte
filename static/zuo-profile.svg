<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)" />
  
  <!-- Hair -->
  <path d="M25 35 Q25 25 35 20 Q45 15 55 20 Q65 15 75 20 Q85 25 85 35 Q85 45 80 50 Q75 55 70 55 Q65 55 60 50 Q55 55 50 55 Q45 55 40 50 Q35 55 30 55 Q25 55 20 50 Q15 45 25 35" fill="url(#hair)" />
  
  <!-- Face -->
  <ellipse cx="50" cy="55" rx="25" ry="30" fill="url(#skin)" />
  
  <!-- Eyes -->
  <circle cx="40" cy="50" r="3" fill="#1f2937" />
  <circle cx="60" cy="50" r="3" fill="#1f2937" />
  <circle cx="41" cy="49" r="1" fill="white" />
  <circle cx="61" cy="49" r="1" fill="white" />
  
  <!-- Nose -->
  <path d="M50 55 Q48 60 50 65" stroke="#dc2626" stroke-width="1.5" fill="none" />
  
  <!-- Mouth -->
  <path d="M40 65 Q45 68 50 65 Q55 68 60 65" stroke="#dc2626" stroke-width="2" fill="none" />
  
  <!-- Glasses frame -->
  <circle cx="40" cy="50" r="8" fill="none" stroke="#1f2937" stroke-width="2" />
  <circle cx="60" cy="50" r="8" fill="none" stroke="#1f2937" stroke-width="2" />
  <path d="M48 50 L52 50" stroke="#1f2937" stroke-width="2" />
  
  <!-- Glasses arms -->
  <path d="M32 50 L25 48" stroke="#1f2937" stroke-width="2" />
  <path d="M68 50 L75 48" stroke="#1f2937" stroke-width="2" />
